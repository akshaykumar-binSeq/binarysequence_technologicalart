[shell]
name = "Binary Sequence App Shell"
status = "canonical_baseline"
max_content_width = "1280px"
container_range_min = "1140px"
container_range_max = "1440px"
foveal_frame_ratio = "4:3"
landscape_mobile_max_height = "440px"
landscape_mobile_header_max_ratio = 0.15
single_document_scroll = true
top_progress_bar_height = "2px"
top_progress_bar_color = "#D97706"

[z_index]
below = -1
base = 0
surface = 10
sticky = 100
drawer = 200
backdrop = 300
modal = 400
popover = 500
toast = 600
skip_link = 700

[breakpoints]
mobile_portrait_max = "639px"
mobile_landscape_max = "767px"
tablet_portrait_max = "1024px"
desktop_min = "1025px"
widescreen_min = "1441px"

[[routes]]
path = "/"
tier = "tier_1_commercial"
feature_id = "FEAT-02-HOME"
layout = "standard_centered"
auth_required = false

