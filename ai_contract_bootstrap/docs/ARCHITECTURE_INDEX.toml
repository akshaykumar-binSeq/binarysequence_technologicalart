[system]
name = "Binary Sequence Technological Art"
version = "1.1.0"
status = "confirmed_baseline"
stack_primary = "Next.js App Router + TypeScript (confirmed by founder DEC-DR03)"
stack_persistence = "Firebase (Firestore, Storage, Hosting per documented requirement; DEC-DR03)"
stack_microservices = "None for V1 (prohibited without documented requirement; DEC-DR03)"
cls_budget_max = 0.05
keyboard_nav_required = true
prefers_reduced_motion_enforced = true

[authority]
machine_contracts = "authoritative_for_structured_testable_facts"
markdown = "authoritative_for_rationale_context_editorial_rules"
implementation = "evidence_of_current_behavior_not_automatic_requirement_authority"
conflict_action = "record_in_discrepancy_register_and_request_resolution"

[precedence_order]
# Conflict resolution: approved strategic/product decisions govern intent; TOML governs exact structured facts once those decisions are encoded and approved.
hierarchy = [
  "1. Foundational identity and strategic playbook (intent)",
  "2. Audience-facing content specification v1.1 (approved content intent)",
  "3. Information Architecture v2.0 (approved route and screen structure)",
  "4. DDD Architectural and Methodological Guidelines v1.0 (architecture principles)",
  "5. Approved machine contracts (*.toml) (exact structured implementation facts)",
  "6. Human specifications (*.md) (rationale and context)",
  "7. Existing codebase (observed implementation; reconcile discrepancies)"
]

[shared_kernel]
path = "src/core/shared-kernel"
allowed_import_roots = ["src/core"]
feature_to_feature_imports = false
must_remain_small_and_stable = true

[[features]]
id = "FEAT-01-ONB"
name = "onboarding"
path = "src/features/onboarding"
tier = "deferred_optional"
public_route = ""
status = "deferred"
note = "Deferred as blocking gate per DEC-DR04; any future onboarding must be non-blocking and optional"
spec_toml = "src/features/onboarding/docs/FEATURE_SPEC.toml"
spec_md = "src/features/onboarding/docs/FEATURE_SPEC.md"
wireframe_toml = "src/features/onboarding/docs/UI_UX_WIREFRAME.toml"
exports = ["OnboardingGate", "useOnboardingStatus"]
dependencies = ["src/core"]

